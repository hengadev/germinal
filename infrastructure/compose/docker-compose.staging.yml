# ─────────────────────────────────────────────────────────────────────────────
# Germinal staging stack (issue 007, PRD module M5).
#
# App, its one-off admin bootstrap and its OWN Redis (issue 029): staging
# shares production's Postgres and Caddy by joining the external
# germinal_network, but never production's Redis — database indexes are not
# a boundary, so staging code could otherwise reset or flush production's
# rate-limit counters. Its app.env points DATABASE_URL at
# `postgres`/germinal_staging (a dedicated role/database the Ansible setup
# creates — PRD M4) and REDIS_HOST at staging_redis.
#
# Each deploy installs this file from the deployed commit to
# /opt/germinal-staging/docker-compose.yml (root 0644; the server reads it
# from the repo, issue 017). Layout:
#   /opt/germinal-staging/docker-compose.yml   this file
#   /opt/germinal-staging/env/{app,admin,redis}.env  Agent-rendered, root 0600
#   /opt/germinal-staging/data/uploads/        persistent uploads
#   /opt/germinal-staging/data/redis/          staging Redis data (999:1000)
#
# SERVICE NAMES: compose registers every service name as a DNS alias on each
# network it joins. Prod's app service is named `app`, so a staging service
# also named `app` would register a second `app` alias on germinal_network
# and round-robin prod's traffic between the two containers. Staging services
# therefore carry the staging_ prefix; their container_names keep the names
# Caddy proxies to (roles/caddy Caddyfile.j2: germinal_staging_app). The
# infisical_agent role mirrors this with an explicit `service` field.
#
# The image tag `henga/germinal:staging` is a LOCAL pin, never pushed — see
# the header of docker-compose.prod.yml.
# ─────────────────────────────────────────────────────────────────────────────
name: germinal_staging

services:
  staging_app:
    image: henga/germinal:staging
    container_name: germinal_staging_app # Caddy's upstream name (Caddyfile.j2)
    restart: unless-stopped
    mem_limit: 512m
    # Least privilege (issue 028), exactly like prod's app: no capabilities
    # (non-root image user), no-new-privileges, a pids limit and a read-only
    # root filesystem — writes go to the uploads bind mount and /tmp.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    expose:
      - "3001"
    env_file:
      - env/app.env
    # No depends_on: postgres/caddy belong to prod's compose project (a
    # staging deploy on a cold server fails its migration step instead —
    # visibly, at the right place); the deploy script starts staging_redis.
    volumes:
      - /opt/germinal-staging/data/uploads:/app/uploads
    networks:
      - germinal_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # One-off admin bootstrap (issue 016) for the staging database — the
  # profile-gated twin of prod's `admin` service. `deploy` runs it on every
  # staging deploy:   docker compose --profile bootstrap run --rm staging_admin
  staging_admin:
    profiles: ["bootstrap"]
    image: henga/germinal:staging
    restart: "no"
    command: ["node", "scripts/create-admin.js"]
    # Hardened like staging_app (issue 028; create-admin.js writes nothing).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - env/app.env
      - env/admin.env
    networks:
      - germinal_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Staging's own Redis (issue 029), hardened and memory-limited like prod's
  # (issue 028): its own user from the start, no capabilities, read-only
  # root filesystem, data under the staging data root. Password from its own
  # env/redis.env, read by the container's shell (`$$`: no compose
  # substitution). The staging_ prefix keeps it from registering a `redis`
  # alias next to prod's on the shared network.
  staging_redis:
    image: redis:7-alpine
    container_name: germinal_staging_redis
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - env/redis.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    read_only: true
    volumes:
      - /opt/germinal-staging/data/redis:/data
    networks:
      - germinal_network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Prod's shared network (external: also declared in docker-compose.prod.yml,
# created by Ansible). Referenced by its compose key so this file needs no
# variables.
networks:
  germinal_network:
    external: true
