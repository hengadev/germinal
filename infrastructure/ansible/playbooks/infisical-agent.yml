---
# Install or rotate the Infisical Agent on the Germinal VPS (issue 008).
#
# The germinal-vps machine-identity credential is read from the operator at
# run time ONLY — never from a file in this repo and never from the Ansible
# Vault (ADR 0004). Export INFISICAL_AGENT_CLIENT_ID and
# INFISICAL_AGENT_CLIENT_SECRET and press Enter at both prompts, or type the
# values (the secret prompt is private and is not echoed).
#
# Re-running this playbook with a NEW client secret is the rotation
# procedure: the Agent restarts with it (no app container restarts; see the
# role README), and the old secret is then revoked in Infisical (operator
# checklist, Phase 9).

- name: Install or rotate the Infisical Agent
  hosts: germinal_servers
  gather_facts: true

  # No `default:` on these prompts: Ansible prints a prompt's default in
  # brackets, even for private prompts, which would echo the secret taken
  # from the environment. Empty answers fall back to the environment below.
  vars_prompt:
    - name: infisical_agent_prompt_client_id
      prompt: germinal-vps client ID (empty = use $INFISICAL_AGENT_CLIENT_ID)
      private: false

    - name: infisical_agent_prompt_client_secret
      prompt: germinal-vps client secret (empty = use $INFISICAL_AGENT_CLIENT_SECRET)
      private: true

  vars:
    infisical_agent_client_id: "{{ infisical_agent_prompt_client_id or lookup('env', 'INFISICAL_AGENT_CLIENT_ID') }}"
    infisical_agent_client_secret: "{{ infisical_agent_prompt_client_secret or lookup('env', 'INFISICAL_AGENT_CLIENT_SECRET') }}"

  roles:
    - role: infisical_agent
      tags: ['infisical', 'agent']
