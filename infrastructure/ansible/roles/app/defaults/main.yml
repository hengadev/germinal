---
# App role default variables

# The directory layout the compose stacks need on the VPS. It MUST match
# infrastructure/compose/README.md exactly (issue 007):
#
#   /opt/germinal/                        PROD
#   ├── env/                              Agent-rendered, root 0600
#   ├── data/postgres/  data/redis/  data/uploads/
#   └── caddy/{config,data,logs}/         created by the caddy role
#   /opt/germinal-staging/                STAGING
#   ├── env/
#   └── data/uploads/
#
# env/ is root-only (0700): the Infisical Agent writes its 0600 renderings
# there. The infisical_agent role creates the same directories with the same
# parameters, so both roles stay idempotent together.
# data/uploads is owned by the app container's user (uid/gid 1001, the
# `nodejs` user from the image's Dockerfile) so local uploads work even
# when S3 is not configured.
app_prod_root: /opt/germinal
app_staging_root: /opt/germinal-staging
app_container_uid: "1001"
redis_container_uid: "999"
redis_container_gid: "1000"
app_stack_directories:
  - { path: "{{ app_prod_root }}/env", mode: "0700" }
  # Owner and mode left to Postgres: its entrypoint chowns its data
  # directory to its own user at start (managed: false).
  - { path: "{{ app_prod_root }}/data/postgres", managed: false }
  # Redis does not chown /data itself: a root-owned directory lets the AOF
  # (in its own subdirectory) work but refuses the RDB snapshot, and Redis
  # then rejects every write (MISCONF). Owned by the redis user of the
  # redis:7-alpine image.
  - { path: "{{ app_prod_root }}/data/redis", owner: "{{ redis_container_uid }}", group: "{{ redis_container_gid }}", mode: "0750" }
  - { path: "{{ app_prod_root }}/data/uploads", owner: "{{ app_container_uid }}", group: "{{ app_container_uid }}", mode: "0750" }
  # Staging's root is root's, like prod's (roles/user): the deploy runner
  # installs the compose file into it as root (issue 017).
  - { path: "{{ app_staging_root }}", mode: "0750" }
  - { path: "{{ app_staging_root }}/env", mode: "0700" }
  - { path: "{{ app_staging_root }}/data/uploads", owner: "{{ app_container_uid }}", group: "{{ app_container_uid }}", mode: "0750" }

# Caddy data directory (shared with caddy role)
caddy_data_dir: "{{ app_base_dir }}/caddy"
