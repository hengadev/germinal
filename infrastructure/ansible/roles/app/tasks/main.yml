---
# Application role tasks (issue 011, PRD module M4)
#
# This role creates directories — and nothing else. Everything that used to
# be rendered here now belongs to another mechanism:
#   env/*.env                        the Infisical Agent (roles/infisical_agent)
#   docker-compose.yml               installed by the deploy runner from the
#                                    deployed commit (roles/deploy_gate, issue
#                                    017); prod's is first installed by
#                                    roles/shared_services
# Releases never go through Ansible: CI asks for `deploy <stack> <sha>` over
# SSH, the deploy gate runs it (infrastructure/compose/). There is no .env template and no
# templated compose file anymore (ADR 0004).

- name: Create the compose stack directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ (item.owner | default('root')) if item.managed | default(true) else omit }}"
    group: "{{ (item.group | default('root')) if item.managed | default(true) else omit }}"
    mode: "{{ (item.mode | default('0755')) if item.managed | default(true) else omit }}"
  loop: "{{ app_stack_directories }}"
