---
# Monitoring agent (Grafana Alloy) on the production stack: installs its
# config and starts it with its Docker socket proxy. Metrics and logs are
# pushed to the homelab (ingest.henga.dev); the push URL and token come from
# Infisical prod /observability through the Agent-rendered
# env/observability.env (ADR 0004).

- name: Create the Alloy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ observability_alloy_dir }}"
    - "{{ observability_alloy_dir }}/data"

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ observability_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# A plain copy: the River syntax's braces are not Jinja.
- name: Install the Alloy config
  ansible.builtin.copy:
    src: config.alloy
    dest: "{{ observability_alloy_dir }}/config.alloy"
    owner: root
    group: root
    mode: "0640"
  register: observability_config

- name: Check the Agent has rendered env/observability.env
  ansible.builtin.stat:
    path: "{{ observability_root }}/env/observability.env"
  register: observability_env_file

- name: Check the production compose file declares the agent
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ observability_root }} config --services
  register: observability_compose_services
  changed_when: false
  check_mode: false

- name: Explain why the agent is not started
  ansible.builtin.debug:
    msg: >-
      {{ 'env/observability.env is missing: add INGEST_URL and INGEST_TOKEN to
      Infisical prod /observability and re-run playbooks/infisical-agent.yml'
      if not observability_env_file.stat.exists else
      'the deployed compose file has no alloy service yet: promote a release
      that has it, then re-run this role' }}
  when: >-
    not observability_env_file.stat.exists
    or 'alloy' not in observability_compose_services.stdout_lines

- name: Start the monitoring agent
  ansible.builtin.command:
    cmd: >-
      docker compose --project-directory {{ observability_root }}
      up -d {{ '--force-recreate' if observability_config.changed else '' }}
      {{ observability_services | join(' ') }}
  when:
    - not ansible_check_mode
    - observability_env_file.stat.exists
    - "'alloy' in observability_compose_services.stdout_lines"
  changed_when: true
