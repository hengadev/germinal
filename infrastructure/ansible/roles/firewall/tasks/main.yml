---
# Firewall (UFW) Configuration Tasks
# - Configure default policies
# - Allow SSH, HTTP, HTTPS
# - Enable UFW

# No `ufw reset` here: it wiped and disabled the firewall on every run, so
# every rule below reported a change. The rules are declarative; a rule
# removed from this list must be deleted by hand (`ufw delete …`).

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443

- name: Allow custom application ports if specified
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ firewall_allowed_ports }}"
  when: firewall_allowed_ports is defined

# SSH is allowed by this `limit` rule alone (allow + brute-force rate
# limiting). A separate `allow` rule for the same port is the same UFW rule,
# so the two replaced each other and both reported a change on every run.
- name: Allow SSH, rate limited to prevent brute force
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: ufw_status
  changed_when: false
