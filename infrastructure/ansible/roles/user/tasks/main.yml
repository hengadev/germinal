---
# User Management Tasks
# - Create the deploy user — NOT root-equivalent (issue 017)
# - One sudoers line: the root deploy runner (roles/deploy_gate)
# - SSH keys: operator keys unrestricted, CI keys forced to the deploy gate

- name: Create deploy user
  # groups: only its own primary group, append: false — this also takes it
  # out of `docker` and `sudo`, which were root-equivalent (issue 017). An
  # empty list would do the same but report a change on every run (the
  # module counts the primary group as a membership).
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    system: false
    shell: /bin/bash
    home: "/home/{{ deploy_user }}"
    create_home: true
    groups: ["{{ deploy_user }}"]
    append: false
    state: present

# One line (issue 017): the deploy user may run the root deploy runner and
# nothing else. The runner validates its arguments itself, reads `deploy`
# and the compose file from the repo at a commit of main, and is root-owned
# (roles/deploy_gate), so this grants "deploy a commit of main" — not a root
# shell. The operator uses the root key for everything else (logs, docker,
# systemctl).
- name: Configure sudoers for deploy user (the deploy runner only)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: |
      # Sudo configuration for {{ deploy_user }} user
      # Managed by Ansible (roles/user) - DO NOT EDIT MANUALLY
      {{ deploy_user }} ALL=(root) NOPASSWD: {{ deploy_gate_runner }}
      Defaults:{{ deploy_user }} !requiretty
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Create .ssh directory for deploy user
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0700'

- name: Collect the deploy user's public keys (list plus legacy single key)
  # One key per operator computer (issue 008). The legacy single
  # deploy_ssh_public_key is still honoured alongside the list.
  ansible.builtin.set_fact:
    deploy_user_key_candidates: "{{ (deploy_ssh_public_keys | default([])) + [deploy_ssh_public_key | default('')] }}"

- name: Assemble the deploy user's public keys (drop empties, deduplicate)
  ansible.builtin.set_fact:
    deploy_user_public_keys: "{{ deploy_user_key_candidates | select('match', '.+') | unique | list }}"
    deploy_user_ci_public_keys: "{{ deploy_ci_ssh_public_keys | default([]) | select('match', '.+') | unique | list }}"

# A CI key also listed as an operator key would get an unrestricted line
# too, and sshd uses the first line that matches the key.
- name: Check no CI key is also an operator key
  ansible.builtin.assert:
    that:
      - >-
        deploy_user_ci_public_keys | map('split') | map(attribute=1) | list
        | intersect(deploy_user_public_keys | map('split') | map(attribute=1) | list)
        | length == 0
    fail_msg: >-
      A key is in both deploy_ssh_public_keys and deploy_ci_ssh_public_keys.
      The CI key (germinal-ci) belongs only in deploy_ci_ssh_public_keys.
    quiet: true

- name: Check whether the deploy user exists yet
  # In --check against a fresh host the user creation above is skipped, and
  # there is no home directory to write authorized_keys into yet. On a real
  # run (or against a configured host) it exists and key management proceeds.
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}"
  register: deploy_user_home

- name: Write the deploy user's authorized_keys
  # The whole file from the two lists: a key removed from a list is removed
  # on the next run, and keys appended by hand do not survive it. Operator
  # keys are unrestricted; CI keys can only run the deploy gate (issue 017):
  # `restrict` turns off pty, port/agent/X11 forwarding and ~/.ssh/rc, and
  # the forced command replaces whatever the client asks for (shell, scp
  # and sftp included).
  ansible.builtin.copy:
    dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    content: |
      # Managed by Ansible (roles/user) - DO NOT EDIT MANUALLY
      {% for key in deploy_user_public_keys %}
      {{ key }}
      {% endfor %}
      {% for key in deploy_user_ci_public_keys %}
      restrict,command="{{ deploy_gate_command }}" {{ key }}
      {% endfor %}
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
  when:
    - (deploy_user_public_keys + deploy_user_ci_public_keys) | length > 0
    - deploy_user_home.stat.exists

# Root's authorized_keys is left alone (the operator's key is already there:
# that is how the playbook was reached as root). The deploy user's
# authorized_keys is managed from the two lists above, so root's keys are
# no longer merged into it.

- name: Ensure root SSH access is maintained (for subsequent playbook runs)
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ deploy_ssh_public_key | default('') }}"
    create: true
    mode: '0600'
    owner: root
    group: root
  when: deploy_ssh_public_key | default('') | length > 0

# Nothing under the stack roots belongs to the deploy user (issue 017). The
# Agent and the deploy runner run `docker compose` there as root: a deploy
# user able to replace docker-compose.yml, or to swap a bind-mounted data
# directory for a symlink, would be root again.
- name: Make the app directories root's
  # state: directory keeps this idempotent (and --check-friendly on a fresh
  # host, where the system role's creation was only simulated).
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
    recurse: false
  loop:
    - "{{ app_base_dir }}"
    - "{{ app_data_dir }}"
    - "{{ app_logs_dir }}"
    - "{{ app_backup_dir }}"

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ app_base_dir }}/scripts"
    state: directory
    owner: root
    group: root
    mode: '0755'

# It tested the docker/systemctl sudo rules issue 017 removed.
- name: Remove the old sudo test script
  ansible.builtin.file:
    path: "{{ app_base_dir }}/scripts/test-sudo.sh"
    state: absent

- name: Display deploy user summary
  ansible.builtin.debug:
    msg:
      - "==========================================="
      - "Deploy User"
      - "==========================================="
      - "User: {{ deploy_user }} (no docker or sudo group)"
      - "sudo: {{ deploy_gate_runner }} only"
      - "Operator keys: {{ deploy_user_public_keys | length }} (unrestricted)"
      - "CI keys: {{ deploy_user_ci_public_keys | length }} (forced command {{ deploy_gate_command }})"
      - "==========================================="
