---
# User Management Tasks
# - Create deploy user
# - Configure restricted sudo access
# - Setup SSH keys

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    system: false
    shell: /bin/bash
    home: "/home/{{ deploy_user }}"
    create_home: true
    groups: "{{ deploy_user_groups }}"
    append: true
    state: present

# SECURITY: Restrict sudo to only necessary commands
# This limits the blast radius if the deploy user is compromised
# Option 1: Full NOPASSWD (convenient but less secure)
# Option 2: Restricted commands (more secure, requires specific command paths)
- name: Configure sudoers for deploy user (restricted access)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: |
      # Sudo configuration for {{ deploy_user }} user
      # Managed by Ansible - DO NOT EDIT MANUALLY

      {% if deploy_sudo_restricted | default(true) %}
      # RESTRICTED: Only allow specific commands without password
      # Docker commands
      {{ deploy_user }} ALL=(ALL) NOPASSWD: /usr/bin/docker, /usr/bin/docker-compose, /usr/local/bin/docker-compose

      # Systemd service management for Docker (Caddy runs as a container)
      {{ deploy_user }} ALL=(ALL) NOPASSWD: /bin/systemctl status docker, /bin/systemctl restart docker

      # Service management via docker compose
      {{ deploy_user }} ALL=(ALL) NOPASSWD: /usr/bin/docker *

      # Log viewing
      {{ deploy_user }} ALL=(ALL) NOPASSWD: /usr/bin/journalctl, /bin/cat /var/log/*

      # Application scripts (backup/restore helpers installed by
      # playbooks/backup.yml; prod-start.sh is gone with the old release
      # paths — CI's deploy script lives in /usr/local/bin)
      {{ deploy_user }} ALL=(ALL) NOPASSWD: {{ app_base_dir }}/scripts/*.sh

      # Backup operations
      {{ deploy_user }} ALL=(ALL) NOPASSWD: /usr/bin/aws s3 *

      {% if deploy_sudo_password_fallback | default(false) %}
      # FALLBACK: Allow password-based sudo for other commands
      {{ deploy_user }} ALL=(ALL) ALL
      {% endif %}

      {% else %}
      # UNRESTRICTED: Full sudo access without password
      # WARNING: Use only for development or if you understand the security implications
      {{ deploy_user }} ALL=(ALL) NOPASSWD:ALL
      {% endif %}

      # Security: Don't require tty for sudo (needed for Ansible)
      Defaults:{{ deploy_user }} !requiretty
    mode: '0440'
    validate: 'visudo -cf %s'
  notify: test sudo configuration

- name: Create .ssh directory for deploy user
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0700'

- name: Collect the deploy user's public keys (list plus legacy single key)
  # One key per operator computer plus the CI deploy key (issue 008): a list
  # is the only shape that can hold several keys without wiping the others.
  # The legacy single deploy_ssh_public_key is still honoured alongside it.
  ansible.builtin.set_fact:
    deploy_user_key_candidates: "{{ (deploy_ssh_public_keys | default([])) + [deploy_ssh_public_key | default('')] }}"

- name: Assemble the deploy user's public keys (drop empties, deduplicate)
  ansible.builtin.set_fact:
    deploy_user_public_keys: "{{ deploy_user_key_candidates | select('match', '.+') | unique | list }}"

- name: Check whether the deploy user exists yet
  # In --check against a fresh host the user creation above is skipped, and
  # the authorized_key module cannot operate on a user that does not exist
  # yet. On a real run (or against a configured host) the home directory
  # exists and key management proceeds normally.
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}"
  register: deploy_user_home

- name: Manage the deploy user's authorized_keys as a list
  # exclusive: the list is the source of truth — a key removed from the list
  # is removed from the server on the next run, and keys appended by hand do
  # not survive it.
  ansible.builtin.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_user_public_keys | join('\n') }}"
    exclusive: true
    state: present
  when:
    - deploy_user_public_keys | length > 0
    - deploy_user_home.stat.exists

# Root's authorized_keys is left alone (the operator's key is already there:
# that is how the playbook was reached as root). The deploy user's
# authorized_keys is managed exclusively from deploy_ssh_public_keys, so
# root's keys are no longer merged into it.

- name: Ensure root SSH access is maintained (for subsequent playbook runs)
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ deploy_ssh_public_key | default('') }}"
    create: true
    mode: '0600'
    owner: root
    group: root
  when: deploy_ssh_public_key | default('') | length > 0

- name: Ensure proper permissions on authorized_keys
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
  when: deploy_user_home.stat.exists

- name: Grant deploy user ownership of app directories
  # state: directory keeps this idempotent (and --check-friendly on a fresh
  # host, where the system role's creation was only simulated).
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0750'
    recurse: false
  loop:
    - "{{ app_base_dir }}"
    - "{{ app_data_dir }}"
    - "{{ app_logs_dir }}"
    - "{{ app_backup_dir }}"

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ app_base_dir }}/scripts"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0755'

- name: Create sudo test script for deploy user
  ansible.builtin.copy:
    dest: "{{ app_base_dir }}/scripts/test-sudo.sh"
    content: |
      #!/bin/bash
      # Test sudo access for deploy user

      echo "Testing sudo access..."
      echo ""

      # Test docker access
      echo -n "Docker: "
      if sudo -n docker --version &>/dev/null; then
        echo "OK"
      else
        echo "FAILED"
      fi

      # Test systemctl access
      echo -n "Systemctl: "
      if sudo -n systemctl status docker &>/dev/null; then
        echo "OK"
      else
        echo "FAILED"
      fi

      echo ""
      echo "For full sudo access, use: sudo -v"
    mode: '0750'
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"

- name: Display sudo configuration summary
  ansible.builtin.debug:
    msg:
      - "==========================================="
      - "Deploy User Sudo Configuration"
      - "==========================================="
      - "User: {{ deploy_user }}"
      - "Groups: {{ deploy_user_groups | join(', ') }}"
      - "Restricted mode: {{ deploy_sudo_restricted | default(true) }}"
      - ""
      - "Allowed commands (no password):"
      - "  - docker, docker-compose"
      - "  - systemctl (docker)"
      - "  - Application scripts in {{ app_base_dir }}/scripts/"
      - "  - Other commands (with password): {{ deploy_sudo_password_fallback | default(false) }}"
      - ""
      - "Test sudo access:"
      - "  {{ app_base_dir }}/scripts/test-sudo.sh"
      - "==========================================="

