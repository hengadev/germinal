---
# Caddy Default Variables

# Caddy data directory (for config, data, and logs)
caddy_data_dir: "{{ app_base_dir }}/caddy"

# ACME email for Let's Encrypt certificate notifications: the /host
# notification email, read from Infisical at setup time (site.yml).
caddy_acme_email: "{{ host_notify_email | default('admin@' + app_domain) }}"

# Proxies Caddy trusts for the client IP header (CF-Connecting-IP): Cloudflare's
# published edge ranges (https://www.cloudflare.com/ips-v4 and /ips-v6). Keep
# in sync with Terraform's cloudflare_ipv4_ranges/cloudflare_ipv6_ranges, which
# restrict the origin firewall to the same ranges (issue 012).
caddy_trusted_proxies:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32

# Client max body size for uploads
caddy_client_max_body_size: "100M"

# The Cloudflare API token for the DNS-01 challenge is deliberately NOT a
# variable: the Caddyfile reads it from the container's environment
# ({env.CLOUDFLARE_API_TOKEN}), fed by the Agent-rendered env/caddy.env
# (ADR 0004, issue 008).
