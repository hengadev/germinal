---
# Caddy Handlers
#
# not ansible_check_mode: both handlers switch to the deploy user and shell
# out to docker compose — in --check against a fresh host the user does not
# exist yet and the commands would be skipped anyway.

- name: reload caddy
  ansible.builtin.command:
    cmd: docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ app_base_dir }}"
  become_user: "{{ deploy_user }}"
  become: true
  failed_when: false
  when:
    - caddy_configured | default(false)
    - not ansible_check_mode

- name: restart caddy
  ansible.builtin.command:
    cmd: docker compose restart caddy
    chdir: "{{ app_base_dir }}"
  become_user: "{{ deploy_user }}"
  become: true
  failed_when: false
  when:
    - caddy_configured | default(false)
    - not ansible_check_mode
