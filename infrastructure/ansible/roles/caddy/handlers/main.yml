---
# Caddy Handlers
#
# Run as root: docker compose reads every service's env_file, and the
# Agent-rendered env files are root-only 0600. Skipped in --check, and until
# roles/shared_services has started Caddy (failed_when: false covers that).

- name: reload caddy
  ansible.builtin.command:
    cmd: docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ app_base_dir }}"
  failed_when: false
  when:
    - caddy_configured | default(false)
    - not ansible_check_mode

- name: restart caddy
  ansible.builtin.command:
    cmd: docker compose restart caddy
    chdir: "{{ app_base_dir }}"
  failed_when: false
  when:
    - caddy_configured | default(false)
    - not ansible_check_mode
