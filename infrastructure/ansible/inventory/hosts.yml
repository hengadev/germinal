# Germinal Inventory
# Usage: ansible-playbook -i inventory/hosts.yml playbooks/site.yml

all:
  children:
    germinal_servers:
      hosts:
        germinal_vps:
          # Placeholder: always passed with -e ansible_host=… (`make setup` reads it
          # from Terraform through ../terraform/tf.sh)
          ansible_host: YOUR_VPS_IP
          ansible_user: root  # Ansible always connects as root (the deploy user can only deploy)

      vars:
        # Application
        app_name: germinal
        app_domain: "{{ lookup('env', 'APP_DOMAIN') | default('germinalstudio.co', true) }}"

        # Directories (the compose layout is completed by the app role; see
        # roles/app/defaults/main.yml and infrastructure/compose/README.md)
        app_base_dir: /opt/{{ app_name }}
        app_data_dir: "{{ app_base_dir }}/data"
        app_logs_dir: "{{ app_base_dir }}/logs"
        app_backup_dir: "{{ app_base_dir }}/backups"

        # Docker
        docker_compose_version: "v2.30.3"
        # Nobody: the docker group is root-equivalent (issue 017).
        docker_users: []

        # Caddy Reverse Proxy
        caddy_enabled: true
        caddy_client_max_body_size: "100M"

        # SSH Configuration
        ssh_port: 22
        ssh_password_authentication: false
        # SECURITY: Root login with SSH key only (no password) - allows admin access
        # Options: "yes" (allow all), "no" (deny all), "without-password" (key-only)
        ssh_permit_root_login: "without-password"
        ssh_allowed_users: ["root", "{{ deploy_user }}"]

        # Firewall: extra ports only. SSH (rate limited), 80 and 443 are
        # always opened by roles/firewall; listing SSH here as a plain
        # `allow` fought the `limit` rule on every run.
        firewall_allowed_ports: []

