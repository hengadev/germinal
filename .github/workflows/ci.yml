name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  # Proves the database layer on every PR before it reaches a real database:
  # apply every migration to an empty Postgres 16 (the same scripts/migrate.js
  # entry point production runs before recreating the app container), fail on
  # schema drift (regenerating migrations from the current schema must produce
  # no diff), then run the integration tests against that migrated database.
  migrations:
    name: Migrations & integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: germinal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # One database plays both roles: it receives every migration, then the
      # integration tests run against exactly what was migrated.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/germinal_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/germinal_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to the empty database
        run: node scripts/migrate.js

      - name: Check for schema drift
        run: |
          pnpm drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain -- drizzle/migrations)" ]; then
            echo "::error::Schema drift: the committed migrations no longer match src/lib/server/db/schema.ts."
            echo "Generate and commit the missing migration locally:"
            echo "  pnpm drizzle-kit generate"
            echo "Files drizzle-kit would add or change:"
            git status --porcelain -- drizzle/migrations
            exit 1
          fi
          echo "No schema drift: committed migrations match the current schema."

      - name: Run integration tests
        run: pnpm test:integration

  # Proves the zero-account onboarding path on every PR: copy .env.example,
  # bring up the dev containers, migrate, seed, build — the same path a
  # portfolio visitor runs via `cp .env.example .env && make try`, minus the
  # never-exiting dev server (try-setup stops after seeding).
  try-path:
    name: Try path (cp .env.example && make try)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Start containers, migrate and seed
        run: make try-setup

      - name: Build
        run: pnpm build

  # ── Staging deploy (issue 009): every push to main that passes the jobs
  # above is built, pushed as henga/germinal:<sha> and deployed to staging.
  # Secrets: Docker Hub token and an SSH deploy key with the server's host
  # key pinned (SSH_KNOWN_HOSTS). No Infisical credential: the server's own
  # Infisical Agent provides every runtime value.
  build-image:
    name: Build and push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, migrations, try-path]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push henga/germinal:${{ github.sha }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: henga/germinal:${{ github.sha }}
          # Reported by /api/health; deploy waits for it (issue 001).
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    # One deploy at a time; a newer push waits rather than cancelling a
    # deploy halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      STACK_ROOT: /opt/germinal-staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH (pinned host key)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      # The compose file and deploy script come from the commit being deployed.
      - name: Copy the compose file and deploy script
        run: |
          scp infrastructure/compose/docker-compose.staging.yml "target:$STACK_ROOT/docker-compose.yml"
          scp infrastructure/compose/deploy "target:$STACK_ROOT/deploy"
          ssh target "chmod 0755 $STACK_ROOT/deploy"

      - name: deploy staging ${{ github.sha }}
        run: ssh target "sudo $STACK_ROOT/deploy staging $GITHUB_SHA"
